# map.toml for docker-compose.yml: copy to ${MAP_CONFIG_DIR}/map.toml and edit. The config folder
# (${MAP_CONFIG_DIR}), the project folder (${MAP_PROJECTS_DIR}) and the agent CLIs are mounted at the same paths as
# on the host, so every path here is also the host's. Replace /home/you/MAP/config and /home/you/MAP/workspace with
# the two folders from .env. Every other setting is documented in map.example.toml.

[server]
# All interfaces inside the container; compose publishes it on the host's 127.0.0.1 only.
bind = "0.0.0.0:4400"
# Required once the dashboard is reachable from outside this machine (e.g. through a Cloudflare tunnel).
# Generate one with `openssl rand -hex 32`; the dashboard asks for it once per browser.
api_token = "change-me"
static_dir = "/app/frontend/out"
data_dir = "/home/you/MAP/config/data"
# The tunnel's public host name, so requests that arrive with it in the Host header are accepted.
# allowed_hosts = ["agents.example.com"]

[workspace]
# Where tasks and sessions without a project run (create it as a git repo: `git init ${MAP_CONFIG_DIR}/data/workspace`).
# It is inside the data folder, so it never shows up as a project.
dir = "/home/you/MAP/config/data/workspace"
session_prefix = "map-"
# MAP marks the default workspace and each project's folder as trusted for Claude Code and Codex before it starts an
# agent there; set false to answer the CLIs' own trust prompts yourself. (With agents_home isolated below, Claude
# Code's file is <config>/agent-home/claude/.claude.json; shared, ~/.claude/.claude.json from CLAUDE_CONFIG_DIR in
# docker-compose.yml.)
trust_folders = true

[workspace.env]
# The host's agent CLIs; keep in sync with PATH in docker-compose.yml (MAP_HOME and MAP_NODE_DIR from .env).
PATH = "/home/you/.local/bin:/home/you/.local/node-v24.13.1-linux-x64/bin:/usr/local/bin:/usr/bin:/bin"

# MAP's agents have their own logins and history in /home/you/MAP/config/agent-home (claude/, codex/,
# gemini-home/), inside the mounted config folder: sign each provider in once under Settings → Agent CLIs. The
# ~/.claude, ~/.codex and ~/.gemini mounts in docker-compose.yml are then not needed. "shared" uses the host's own
# sign-ins through those mounts instead (see map.example.toml).
[agents_home]
mode = "isolated"

[orchestrator]
autostart = false
max_parallel = 1
provider_order = ["claude", "codex", "gemini"]

[providers.claude]
# Unattended workers stop at every permission prompt without this; only enable it if you accept that risk.
# extra_args = ["--dangerously-skip-permissions"]

[providers.gemini]
binary = "agy"

[reflex]
binary = "/usr/local/bin/reflex"

[projects]
# The project folder: MAP_PROJECTS_DIR from .env (mounted at the same path). Projects can only be its sub-folders,
# and the dashboard's folder picker browses nothing else; "Clone from git" suggests <path>/<repo name>.
path = "/home/you/MAP/workspace"
# Mounted at another path in the container instead? Use roots, with the host's path for display:
# roots = [{ name = "Projects", path = "/projects", host_path = "/home/you/MAP/workspace" }]
# MAP's SSH key, known_hosts and gitconfig live in <data_dir>/git (on the host too), so cloning, pulling and
# pushing work without mounting ~/.ssh. Create the key under Settings → Git & SSH and add its public half to
# GitHub or GitLab.
