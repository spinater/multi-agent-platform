<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:12px;font-family:'Geist Mono',ui-monospace,monospace;color:var(--text)">
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <span style="font:500 10.5px/1 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap">{{ vm.progress }}</span>
    <span style="flex:1 1 120px;display:flex;gap:3px;min-width:100px">
      <sc-for list="{{ vm.steps }}" as="b" hint-placeholder-count="5"><span style="flex:1;height:4px;border-radius:2px;background:{{ b.seg }}"></span></sc-for>
    </span>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px">
    <sc-for list="{{ vm.steps }}" as="s" hint-placeholder-count="5">
      <div style="display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid {{ s.border }};border-radius:10px;background:{{ s.bg }};min-width:0">
        <div style="display:flex;align-items:center;gap:9px">
          <span style="flex:none;width:20px;height:20px;border-radius:50%;border:1px solid {{ s.ring }};background:{{ s.fill }};color:{{ s.markColor }};font:600 10.5px/18px 'Geist Mono',monospace;text-align:center">{{ s.mark }}</span>
          <span style="font:600 12.5px/1.25 'Geist Mono',monospace">{{ s.title }}</span>
        </div>
        <span style="font:400 11.5px/1.5 'Geist Mono',monospace;color:var(--muted);text-wrap:pretty">{{ s.desc }}</span>
        <span style="font:500 10.5px/1.4 'Geist Mono',monospace;color:{{ s.statusColor }};word-break:break-word">{{ s.status }}</span>
        <sc-if value="{{ s.hasCta }}" hint-placeholder-val="{{ false }}">
          <button onClick="{{ s.onCta }}" style="align-self:flex-start;height:28px;padding:0 11px;border-radius:6px;border:1px solid {{ s.ctaBorder }};background:{{ s.ctaBg }};color:{{ s.ctaColor }};font:600 11px/1 'Geist Mono',monospace;letter-spacing:.04em;cursor:pointer;white-space:nowrap">{{ s.cta }}</button>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:240},&quot;vm&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
