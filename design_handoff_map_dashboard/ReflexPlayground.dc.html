<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:12px;font-family:'Geist Mono',ui-monospace,monospace;color:var(--text)">
  <sc-if value="{{ vm.hasNotice }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid {{ vm.noticeBorder }};border-radius:8px;background:{{ vm.noticeBg }}">
      <span style="font:400 11.5px/1.5 'Geist Mono',monospace;color:var(--text);text-wrap:pretty">{{ vm.notice }}</span>
    </div>
  </sc-if>
  <div style="display:flex;flex-wrap:wrap;gap:6px">
    <sc-for list="{{ vm.questions }}" as="q" hint-placeholder-count="3">
      <button onClick="{{ q.onClick }}" style="height:28px;padding:0 10px;border-radius:6px;border:1px solid {{ q.border }};background:{{ q.bg }};color:{{ q.color }};font:500 11px/1 'Geist Mono',monospace;cursor:pointer;white-space:nowrap">{{ q.label }}<span style="color:var(--faint)"> · {{ q.type }}</span></button>
    </sc-for>
  </div>
  <span style="font:500 12.5px/1.4 'Geist Mono',monospace">{{ vm.qText }}</span>
  <span style="font:400 10.5px/1.4 'Geist Mono',monospace;color:var(--faint);word-break:break-word">options: {{ vm.qOptions }}</span>
  <textarea rows="3" value="{{ vm.input }}" onChange="{{ vm.onInput }}" placeholder="Paste an alert, a log line or a ticket in English" style="width:100%;resize:vertical;background:var(--bg);border:1px solid var(--line2);border-radius:8px;color:var(--text);padding:10px 12px;font:400 12.5px/1.55 'Geist Mono',monospace;outline:none"></textarea>
  <div style="display:flex;flex-wrap:wrap;gap:6px">
    <sc-for list="{{ vm.examples }}" as="e" hint-placeholder-count="3">
      <button onClick="{{ e.onClick }}" style="max-width:100%;height:24px;padding:0 9px;border-radius:5px;border:1px solid var(--line);background:transparent;color:var(--muted);font:400 10.5px/1 'Geist Mono',monospace;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ e.label }}</button>
    </sc-for>
  </div>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <button onClick="{{ vm.onAsk }}" style="height:34px;padding:0 16px;border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:600 12px/1 'Geist Mono',monospace;letter-spacing:.04em;cursor:pointer;white-space:nowrap;opacity:{{ vm.askOpacity }}">Ask Reflex</button>
    <span style="font:400 11px/1.4 'Geist Mono',monospace;color:{{ vm.liveHintColor }}">{{ vm.liveHint }}</span>
  </div>

  <sc-if value="{{ vm.has }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;gap:14px;padding:14px;border:1px solid {{ vm.r.border }};border-radius:10px;background:{{ vm.r.bg }}">
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px">
        <span style="display:inline-flex;align-items:center;gap:7px;height:22px;padding:0 8px;border-radius:5px;border:1px solid {{ vm.r.color }};font:600 10px/1 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:{{ vm.r.color }};white-space:nowrap"><span style="width:6px;height:6px;border-radius:50%;background:{{ vm.r.color }}"></span>lane · {{ vm.r.lane }}</span>
        <span style="font:600 18px/1.2 'Geist Mono',monospace;word-break:break-word">{{ vm.r.answer }}</span>
        <span style="margin-left:auto;font:500 11px/1 'Geist Mono',monospace;color:var(--muted);white-space:nowrap">{{ vm.r.ms }}</span>
      </div>
      <span style="font:400 11.5px/1.5 'Geist Mono',monospace;color:var(--muted);text-wrap:pretty">{{ vm.r.reason }}</span>
      <sc-if value="{{ vm.r.hasConf }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:6px">
          <div style="display:flex;justify-content:space-between;gap:10px;font:500 10px/1 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)"><span>confidence · log scale</span><span style="color:var(--text);letter-spacing:.02em;text-transform:none">{{ vm.r.confLine }}</span></div>
          <div style="position:relative;height:26px">
            <span style="position:absolute;left:0;right:0;top:12px;height:2px;background:var(--line2)"></span>
            <span style="position:absolute;top:12px;height:2px;left:{{ vm.r.thPct }};right:0;background:var(--reflex);opacity:.6"></span>
            <span style="position:absolute;top:4px;bottom:4px;width:2px;left:{{ vm.r.thPct }};background:var(--accent)"></span>
            <span style="position:absolute;top:6px;width:14px;height:14px;margin-left:-7px;border-radius:50%;left:{{ vm.r.cPct }};background:{{ vm.r.color }};border:2px solid var(--panel)"></span>
          </div>
          <div style="position:relative;height:12px;font:400 9.5px/1 'Geist Mono',monospace;color:var(--faint)">
            <span style="position:absolute;left:0">1e-5</span><span style="position:absolute;left:23.9%;transform:translateX(-50%)">3e-5</span><span style="position:absolute;left:50%;transform:translateX(-50%)">1e-4</span><span style="position:absolute;left:73.9%;transform:translateX(-50%)">3e-4</span><span style="position:absolute;right:0">1e-3</span>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{ vm.r.hasOpts }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:5px">
          <span style="font:500 10px/1 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)">scores per option</span>
          <sc-for list="{{ vm.r.opts }}" as="o" hint-placeholder-count="3">
            <div style="display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr) 56px;align-items:center;gap:10px;font:400 11px/1 'Geist Mono',monospace">
              <span style="color:{{ o.color }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ o.name }}</span>
              <span style="height:4px;border-radius:2px;background:var(--line);overflow:hidden;display:block"><span style="display:block;height:100%;width:{{ o.w }};background:{{ o.color }}"></span></span>
              <span style="text-align:right;color:var(--muted)">{{ o.conf }}</span>
            </div>
          </sc-for>
        </div>
      </sc-if>
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--line)">
        <span style="font:500 10px/1 'Geist Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:4px">{{ vm.r.fbQ }}</span>
        <button onClick="{{ vm.r.onRight }}" style="height:28px;padding:0 11px;border-radius:6px;border:1px solid {{ vm.r.rightBorder }};background:transparent;color:var(--text);font:500 11px/1 'Geist Mono',monospace;cursor:pointer;white-space:nowrap">✓ Correct</button>
        <button onClick="{{ vm.r.onWrong }}" style="height:28px;padding:0 11px;border-radius:6px;border:1px solid {{ vm.r.wrongBorder }};background:transparent;color:var(--text);font:500 11px/1 'Geist Mono',monospace;cursor:pointer;white-space:nowrap">✕ Wrong</button>
        <span style="font:400 10.5px/1.4 'Geist Mono',monospace;color:var(--muted)">{{ vm.r.fbMsg }}</span>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:520},&quot;vm&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
