# Copy to map.toml and edit. Relative paths resolve against this file's directory.

[server]
# How deploy/install.sh --mode set this machine up: "isolated" (own folder, sign-ins and tmux server) or "system"
# (one with the machine: your sign-ins and tmux server, projects in your home folder). Informational only.
# mode = "isolated"
# Loopback only. To reach it from elsewhere, put an authenticating proxy (e.g. Cloudflare Access) in front,
# add the proxy's host name to allowed_hosts, and set api_token.
bind = "127.0.0.1:4400"
# api_token = "change-me"
static_dir = "frontend/out"
data_dir = ".map"
# allowed_hosts = ["agents.example.com"]
# Origins allowed to open the WebSocket besides the dashboard itself (the `next dev` server by default).
# allowed_origins = ["http://localhost:3000", "http://127.0.0.1:3000"]

[workspace]
# The repository the agents work in.
dir = "../my-repo"
# Only tmux sessions with this prefix are managed; nothing else is ever touched.
session_prefix = "map-"
# MAP marks the default workspace and each project's folder as trusted for Claude Code, Codex, Copilot and OpenRouter
# before it starts an agent there; set false to answer the CLIs' own trust prompts yourself.
trust_folders = true
# A private tmux server for MAP's sessions (`tmux -L <name>`), apart from the tmux you use yourself; attach with
# `tmux -L <name> attach -t <session>` (Settings → Server shows the command). Unset: tmux's default server. Either
# way MAP drops TMUX and TMUX_PANE from its tmux commands, so a MAP started inside tmux never targets that server.
# tmux_socket = "map"

# Whose logins and history MAP's agents use.
#   "shared"   (the default) the CLIs' usual folders, ~/.claude, ~/.codex, ~/.gemini: the same accounts, settings
#              and history as your own claude / codex / agy in a terminal.
#   "isolated" each provider gets <dir>/<provider> (agy: <dir>/gemini-home, used as its HOME), exported to every
#              CLI MAP starts (sessions, tasks, planner, init, sign-in and update helpers, headless fallback and audit
#              calls, version checks): CLAUDE_CONFIG_DIR, CODEX_HOME, HOME. MAP's agents then sign in once with their own
#              accounts (Settings → Agent CLIs → Sign in) and keep their own history; your own CLIs are unaffected.
#              Nothing is copied between the two. Credentials, usage, skills, sub-agents and folder trust are read
#              from (and written to) MAP's folders.
[agents_home]
mode = "shared"
# Default: agent-home next to this file (<data_dir>/agent-home without a file). Created with mode 0700.
# dir = "agent-home"

# Exported in each agent's launch script and in verify/post_done commands.
[workspace.env]
PATH = "/opt/homebrew/bin:/usr/local/bin:/Users/you/.local/bin:/Users/you/.bun/bin:/usr/bin:/bin"
# For agents that open pull/merge requests and issues with `gh` or `glab` (Settings → Git & SSH shows only whether
# these are set, never their values; the dashboard never takes them). Clone, pull and push use SSH instead.
# GH_TOKEN = "github_pat_…"
# GITLAB_TOKEN = "glpat-…"
# GITLAB_HOST = "gitlab.example.com"   # self-hosted GitLab only

[watcher]
interval_secs = 5
# A worker whose pane has not changed for this long is flagged as stalled.
stall_minutes = 45
wake_cooldown_secs = 60
# Used when a rate-limit message carries no reset time.
default_rate_limit_wait_secs = 300
wake_prompt = "The rate limit has reset. Check where you stopped and continue the task."

[orchestrator]
# Start running ready tasks as soon as the server starts (otherwise press Run in the dashboard).
autostart = false
max_parallel = 1
max_attempts = 2
task_timeout_minutes = 240
provider_order = ["claude", "codex", "gemini"]
provider_cooldown_minutes = 30
# All must exit 0 after the agent reports done, or the task is retried with the output in its prompt.
verify = ["bun test", "bun run typecheck", "bun run lint", "bun run build"]
# Run after a task passes. {id} and {title} are substituted (title is shell-quoted).
# post_done = ["git add -A && git commit -m \"Task {id}: \"{title}", "git push"]

[orchestrator.audit]
# A second agent reviews the change and must answer VERDICT: PASS before the task counts as done.
enabled = true
# false: accept on verification alone when every auditor is out of quota; true: fail the task.
required = false
chain = ["gemini", "claude", "codex"]
timeout_secs = 600

# Models for a project's Reflex tier gate (project settings → Reflex gates → tier): the project's Reflex rates each
# task without a pinned model light, standard or heavy, and the worker gets this provider's model for that tier.
# Built in for claude only (haiku / sonnet / opus); a table here replaces the built-in one. Providers without a
# table, and tiers left out, keep the model they would have used. Each model must be in the provider's `models`.
# [orchestrator.tiers.claude]
# light = "haiku"
# standard = "sonnet"
# heavy = "opus"
# [orchestrator.tiers.codex]
# light = "gpt-6-luna"
# standard = "gpt-6-astra"
# heavy = "gpt-6-sol"

# Built-in providers: claude, codex, gemini (the `agy` CLI), and opt-in cursor, copilot and openrouter (Claude Code via
# OpenRouter), further down. Any field below overrides the built-in value.
# Templates substitute {binary}, {model}, {session} and, for headless, {prompt}.

#
# Sign-in (the dashboard's sign-in modal, POST /api/providers/<name>/login):
#   login         command run in a helper tmux session `<session_prefix>login-<name>` ({binary} substituted)
#   login_send    text typed into that session after startup_secs, for CLIs that sign in from their TUI
#   login_warning shown before a sign-in starts
#   credentials   files the CLI keeps its sign-in in (~/ is $HOME); only whether they exist and parse is checked,
#                 their contents are never read out. Empty: the dashboard shows the sign-in state as unknown.
#   api_key_env   variable that holds an API key instead; set it in [workspace.env] (the dashboard never takes keys)
#
# Updates (the bell in the top bar, [updates] below):
#   version       prints the installed version ({binary} substituted); the first x.y.z in its output counts.
#                 [] turns the check off: the dashboard shows the version as unknown.
#   latest        where the newest version is published, fetched without credentials:
#                 { url = "...", json = "dotted.path" }. Without json the body is the version. The url may use
#                 {os} (linux, darwin, windows), {arch} (amd64, arm64) and {channel}, read from one key of a JSON file:
#                 channel = { file = "~/...json", key = "...", default = "..." }. latest = { url = "" } clears it.
#   update        run in a helper tmux session `<session_prefix>update-<name>` when you press Update; [] hides it.
#                 Refused when the CLI is installed where this user cannot write (the Docker deploy's read-only mounts).
#
# Folder trust (workspace.trust_folders above):
#   trust         where the CLI records trusted folders, which MAP writes before starting it in a folder:
#                 { format = "claude_json" | "codex_toml" | "trusted_folders_json" | "claude_json_onboarded",
#                   file = "~/...", dir_env = "VAR", dir_file = "..." }.
#                 With dir_env set (in [workspace.env] or MAP's environment) the file is <$dir_env>/<dir_file>.
#                 Built in: claude  { format = "claude_json", file = "~/.claude.json", dir_env = "CLAUDE_CONFIG_DIR", dir_file = ".claude.json" }
#                           codex   { format = "codex_toml", file = "~/.codex/config.toml", dir_env = "CODEX_HOME", dir_file = "config.toml" }
#                           copilot { format = "trusted_folders_json", file = "~/.copilot/config.json", dir_env = "COPILOT_HOME", dir_file = "config.json" }
#                           openrouter { format = "claude_json_onboarded", ... }: claude_json plus hasCompletedOnboarding
#                           (its config folder is MAP's alone, so a first run skips Claude Code's theme picker)
#                 None for gemini (agy) and cursor. trust = { file = "" } turns it off for one provider.
#                 In isolated mode ([agents_home]) the variable is MAP's folder for the CLI.
#   trust_markers pane text of the CLI's trust question; the session then shows as needs_trust.
#   trust_accept  the label of the option that trusts the folder ("Yes, I trust this folder"), which the dashboard's
#                 "Trust this folder" button selects.
#
# State folder ([agents_home] above):
#   home_env      the variable that relocates the CLI's state; set to MAP's folder in isolated mode.
#                 Built in: claude CLAUDE_CONFIG_DIR, codex CODEX_HOME, gemini HOME (agy has no variable of its own).
#   default_home  its folder otherwise (~/.claude, ~/.codex, ~/.gemini). Every path MAP reads under it (credentials,
#                 [skills], [agents], [usage], the update channel file) follows the folder the CLI really uses.
#   home_subdir   the state folder inside home_env's folder ("" ; gemini ".gemini").
#   isolated_dir  the folder's name under [agents_home] dir (default: the provider's name; gemini "gemini-home").
#   home_keep     VAR=~/path exported with home_env in isolated mode, so tools an agent runs keep their real folders
#                 when HOME moves (gemini: CARGO_HOME, RUSTUP_HOME, GOPATH). A value in MAP's environment wins.
#   home_env = "" opts one provider out: it keeps using its usual folders and sign-in.
#   shared_home   the folder home_env points at in shared mode too (openrouter: ~/.claude-openrouter), for a provider
#                 that runs another one's CLI and must never use that one's sign-in. It wins over [workspace.env].
#
# Environment:
#   env           { VAR = "value" } exported for every run of the provider, after [workspace.env] (so it wins). A value
#                 that is exactly "$NAME" is a reference: launch scripts say export VAR="$NAME", so a secret's value is
#                 never written to disk; commands MAP runs itself (headless fallback, audit) read NAME from
#                 [workspace.env] or MAP's environment.

[providers.claude]
# Unattended workers need this, or they stop at every permission prompt (the watcher shows them as waiting).
# extra_args = ["--dangerously-skip-permissions"]
# models = ["opus", "sonnet", "haiku", "fable"]
# default_model = "sonnet"
# login = ["{binary}", "auth", "login"]
# credentials = ["~/.claude/.credentials.json"]
# api_key_env = "ANTHROPIC_API_KEY"
# version = ["{binary}", "--version"]
# The channel Claude Code itself follows (autoUpdatesChannel: latest or stable).
# latest = { url = "https://downloads.claude.ai/claude-code-releases/{channel}", channel = { file = "~/.claude/settings.json", key = "autoUpdatesChannel", default = "latest" } }
# update = ["{binary}", "update"]

[providers.codex]
# extra_args = ["--dangerously-bypass-approvals-and-sandbox"]
# The reasoning effort of Configure's "Ask an agent" runs, put before the prompt ({effort}: low, medium, high, xhigh).
# Every provider has this field; only codex has it set by default.
# effort_args = ["-c", "model_reasoning_effort={effort}"]
# default_model = "gpt-6-sol"
# Device-code sign-in. codex signs out the current account as soon as it starts.
# login = ["{binary}", "login", "--device-auth"]
# credentials = ["~/.codex/auth.json"]
# api_key_env = "OPENAI_API_KEY"
# version = ["{binary}", "--version"]
# latest = { url = "https://registry.npmjs.org/@openai/codex/latest", json = "version" }
# Installed with npm: `codex update` updates through npm (or use ["npm", "i", "-g", "@openai/codex@latest"]).
# update = ["{binary}", "update"]

[providers.gemini]
# binary = "agy"
# default_model = "gemini-3.8-flash-high"
# agy signs in from its TUI; it may keep the token in the system keyring instead of the file below.
# login = ["{binary}"]
# login_send = "/login"
# credentials = ["~/.gemini/jetski-standalone-oauth-token"]
# api_key_env = "GEMINI_API_KEY"
# version = ["{binary}", "--version"]
# latest = { url = "https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/{os}_{arch}.json", json = "version" }
# agy also updates itself in the background; a running session keeps the old version until it restarts. In isolated
# mode agy runs with HOME=<dir>/gemini-home, so a self-update lands in that HOME, not in the agy on your PATH: update
# agy from your own shell. agy may keep its token in the system keyring, which a different HOME does not isolate.
# update = ["{binary}", "update"]

# Also built in, and opt-in: add them to provider_order (or pick them for a task, project or the planner) to use them.
# A provider whose binary is missing just shows as not installed.
#
# Cursor CLI (https://cursor.com/docs/cli/overview), installed as `cursor-agent` (and `agent`).
[providers.cursor]
# binary = "cursor-agent"
# `cursor-agent --list-models` prints the ids your account can use; list them here (the built-in list is just "auto").
# models = ["auto"]
# default_model = "auto"
# Unattended workers: --force runs commands without asking (unless denied in ~/.cursor/cli-config.json).
# extra_args = ["--force"]
# headless = ["{binary}", "-p", "--output-format", "text", "--trust", "--model", "{model}", "{prompt}"]
# Browser sign-in; NO_OPEN_BROWSER makes it print the URL. Where the CLI keeps the sign-in is not documented, so the
# dashboard shows it as unknown unless CURSOR_API_KEY is set.
# login = ["env", "NO_OPEN_BROWSER=1", "{binary}", "login"]
# api_key_env = "CURSOR_API_KEY"
# Where cursor keeps trusted folders is not documented: MAP does not write it, and its "Trust this workspace"
# question shows as needs_trust (the session's "Trust this folder" button answers it).
# trust_markers = ["Workspace Trust Required", "Do you want to trust this workspace", "Trust this workspace"]
# update = ["{binary}", "update"]
# Isolated mode gives it a HOME of its own (<dir>/cursor-home), like agy: CURSOR_CONFIG_DIR moves its config but
# not provably its sign-in.

# GitHub Copilot CLI (https://docs.github.com/en/copilot/how-tos/copilot-cli), npm @github/copilot.
[providers.copilot]
# binary = "copilot"
# models = ["auto", "claude-opus-5.5", "claude-sonnet-4.6", "claude-haiku-4.5", "gpt-6-astra", "gpt-5.6-luna", "gpt-5.4-mini"]
# default_model = "auto"
# Unattended workers need tool approval switched off (--allow-all-tools; --yolo also allows every path and URL).
# extra_args = ["--allow-all-tools"]
# headless = ["{binary}", "-p", "{prompt}", "--model", "{model}", "-s", "--no-ask-user"]
# Device-code sign-in. Or a fine-grained token with the "Copilot Requests" permission in COPILOT_GITHUB_TOKEN (GH_TOKEN
# and GITHUB_TOKEN also work; classic ghp_ tokens do not). The sign-in sits in the system keychain, so without the
# variable the dashboard shows it as unknown.
# login = ["{binary}", "login", "--device-code"]
# api_key_env = "COPILOT_GITHUB_TOKEN"
# MAP adds each folder to trusted_folders in ~/.copilot/config.json ($COPILOT_HOME/config.json).
# trust = { format = "trusted_folders_json", file = "~/.copilot/config.json", dir_env = "COPILOT_HOME", dir_file = "config.json" }
# latest = { url = "https://registry.npmjs.org/@github/copilot/latest", json = "version" }
# update = ["{binary}", "update"]

# OpenRouter (https://openrouter.ai/docs/guides/guides/coding-agents): Claude Code against OpenRouter's
# Anthropic-compatible endpoint. Set OPENROUTER_API_KEY in MAP's own environment (e.g. the systemd unit's
# EnvironmentFile): launch scripts export ANTHROPIC_AUTH_TOKEN="$OPENROUTER_API_KEY" by reference and never write the
# key, and the dashboard only shows whether it is set. With the default tmux server a session only sees variables
# that server has, so use workspace.tmux_socket (a server MAP starts, with MAP's environment). It has its own Claude
# config folder (~/.claude-openrouter; isolated: <dir>/openrouter), never the claude provider's sign-in.
[providers.openrouter]
# binary = "claude"
# models = ["~anthropic/claude-sonnet-latest", "~anthropic/claude-opus-latest", "~anthropic/claude-haiku-latest", "anthropic/claude-sonnet-5.5", "anthropic/claude-opus-5.5", "openai/gpt-6.1-sol", "google/gemini-4-argon", "moonshotai/kimi-k3"]
# default_model = "~anthropic/claude-sonnet-latest"
# extra_args = ["--dangerously-skip-permissions"]
# api_key_env = "OPENROUTER_API_KEY"
# Exported after [workspace.env]; a value that is exactly $NAME is exported by reference ("$NAME").
# env = { ANTHROPIC_BASE_URL = "https://openrouter.ai/api", ANTHROPIC_AUTH_TOKEN = "$OPENROUTER_API_KEY", ANTHROPIC_API_KEY = "", ANTHROPIC_DEFAULT_OPUS_MODEL = "~anthropic/claude-opus-latest", ANTHROPIC_DEFAULT_SONNET_MODEL = "~anthropic/claude-sonnet-latest", ANTHROPIC_DEFAULT_HAIKU_MODEL = "~anthropic/claude-haiku-latest" }
# shared_home = "~/.claude-openrouter"

# A provider that is not built in needs at least binary and interactive:
# [providers.aider]
# binary = "aider"
# interactive = ["{binary}", "--model", "{model}"]
# models = ["sonnet"]
# default_model = "sonnet"
# prompt_mode = "send"          # "arg": prompt as last argument; "send": typed in after startup_secs
# idle_markers = ["> "]
# auth_markers = ["API key"]
# Sessions MAP keeps alive (a project's manager, persistent lanes): name a new conversation, and resume it after a
# restart ({session_id} is a UUID MAP picks). Claude's: ["--session-id", "{session_id}"] and ["--resume", "{session_id}"].
# session_id_args = []
# resume_args = []
# A CLI that signs in from its TUI (login_send): the pane text of its prompt (default: idle_markers), and of harmless
# first-run pickers MAP answers with Enter first (never a trust or permission question). agy's defaults:
# login_ready = ["Type your message"]
# login_onboarding = ["Choose your color scheme", "[Next]", "enter Confirm", "Select login method"]
# A terms / data-use question MAP never answers: the sign-in shows it as `consent` for you to decide in its console.
# login_consent = ["Terms of Service & Data Use"]

# Projects: each one is a folder on this machine (used in place), a corpus repo and its own Reflex decision engine
# (https://reflex.gist.rs).
# Questions go to Reflex first; only those below the project's threshold reach the fallback LLM.
[reflex]
# binary = "reflex"
# port_base = 7400
# Used by projects whose fallback is "api"; the other fallbacks are the providers above, run headless. The key is read
# from MAP's environment (or [workspace.env]) for each call, never stored or shown.
# api_key_env = "ANTHROPIC_API_KEY"
# api_model = "claude-haiku-5-5"
# "anthropic" (Messages API) or "openai" (Chat Completions, which OpenRouter and other gateways speak).
# api_format = "anthropic"
# Unset: the format's own endpoint (api.anthropic.com, api.openai.com). OpenRouter:
# api_format = "openai"
# api_url = "https://openrouter.ai/api/v1/chat/completions"
# api_key_env = "OPENROUTER_API_KEY"
# api_model = "~anthropic/claude-haiku-latest"
# The Reflex savings page (#reflex/savings) prices each fallback call from the API's reported usage, else at
# ~4 chars per token. A headless CLI's own system prompt is not in that count: add a headless CLI call's own
# system-prompt cost if you want it counted (tokens per call, added to both saved and spent; default 0).
# fallback_overhead_tokens = { claude = 0, codex = 0, gemini = 0, api = 0 }
# The orchestrator gates (intake, tier, audit) have a Reflex of their own, shared by every project, with one corpus
# domain per answer (<data_dir>/gates/corpus.git, seeded on first start). Default port: just below port_base.
# gates_port = 7399
# Unset: shadow, the gates' answers are logged but none is acted on. Set it (or in Settings → Reflex gates) once the
# logged answers above it are right; Reflex's raw confidences are small, around 1e-3..5e-2.
# gates_threshold = 0.02

# Reflex's own updates: a row of the update bell like a provider CLI. A new release is announced once; "Run update"
# runs the installer (it checks the archive's SHA-256) in the helper session <prefix>update-reflex, {dir} being the
# folder of reflex.binary, then every Reflex restarts on the new version. auto = true installs a release unasked.
# latest_url = "" turns the check off.
[reflex.update]
# latest_url = "https://api.github.com/repos/gist-rs/reflex/releases/latest"
# install = ["/bin/sh", "-c", "curl -fsSL https://raw.githubusercontent.com/gist-rs/reflex/main/install.sh | REFLEX_INSTALL_DIR=\"$1\" sh", "sh", "{dir}"]
# auto = false

# The Skills screen: what each agent can load in a workspace, where it comes from, and which tasks used it.
# MAP only reads these locations. The one file it writes is <workspace>/.claude/settings.local.json, when you
# disable or enable a skill for a project (a `Skill(name)` deny rule, plus `skillOverrides` for non-plugin skills).
# `~` expands to $HOME; *_project_dirs are relative to each workspace.
[skills]
# context_files = { claude = "CLAUDE.md", codex = "AGENTS.md", gemini = "GEMINI.md", copilot = ".github/copilot-instructions.md" }
# claude_project_dirs = [".claude/skills"]
# codex_project_dirs = [".agents/skills"]
# CLIs that load project skills from some of those folders natively (shown on the skill; nothing else changes).
# also_loaded_by = { cursor = [".claude/skills", ".agents/skills"], copilot = [".claude/skills", ".agents/skills"], openrouter = [".claude/skills"] }
# claude_user_dirs = ["~/.claude/skills"]
# claude_plugin_dirs = ["~/.claude/plugins"]
# codex_user_dirs = ["~/.codex/skills"]
# claude_settings = "~/.claude/settings.json"
# Load counts come from Claude Code's session transcripts of the workspace.
# claude_transcripts = "~/.claude/projects"

# Project templates: "Init" on a project lays a development process (task cards, a verify gate, docs folders, agents
# for every CLI) into the project's folder, never overwriting a file, then queues an init agent that fills in the
# project-specific parts from your description. "team-process" is built in; each subfolder of these dirs with a
# template.toml is another template (one with a built-in's name replaces it). `~` expands to $HOME.
[templates]
# dirs = ["~/.config/map/templates"]
# The init agent's instructions (Markdown); unset: the ones built into MAP (backend/templates/init-agent.md).
# init_agent = "~/.config/map/init-agent.md"
# The planner agent's instructions (Markdown): the requirements agent every project (and the default workspace) has.
# "Talk to the planner" starts it in <session_prefix>plan-<slug> with these as its first prompt; it turns what you
# ask for into a draft plan of tasks that waits for your approval. Unset: backend/templates/planner-agent.md.
# planner_agent = "~/.config/map/planner-agent.md"
# A project manager's instructions (Markdown): the always-on agent a project can have (<session_prefix>mgr-<slug>,
# turned on in the project page's Manager panel). Unset: backend/templates/manager-agent.md.
# manager_agent = "~/.config/map/manager-agent.md"

# Projects are folders on this machine, and only sub-folders of the project folder `path` (checked on the server for
# an existing folder, a new one and a clone target; no `..`, no symlink out of it; the folder itself is not allowed).
# The new-project wizard's folder picker browses nothing else, and "Clone from git" suggests <path>/<repo name>. This
# limits only where projects are made, not what an agent can read or run once started (that is the CLI's own
# permissions or sandbox, or in Docker the container's mounts). `root` is the older name of `path`. A project made
# outside it earlier keeps working, with a warning on its page. MAP's own git commands in
# project folders (clone, ls-remote, fetch, pull, push) use MAP's gitconfig and SSH key (Settings → Git & SSH, kept
# in <data_dir>/git/), never prompt, and stop after git_timeout_secs. Agents get the same gitconfig as
# GIT_CONFIG_GLOBAL; it includes your own ~/.gitconfig after MAP's defaults, so your settings win.
[projects]
# path = "~/project"
# Advanced, instead of `path`: several named project folders. `host_path` is display only (the same folder on the
# host when a container mounts it elsewhere); `allow_root_itself` lets the folder itself be a project's folder.
# roots = [
#   { name = "Projects", path = "~/project" },
#   { name = "Clients", path = "/srv/clients", host_path = "/home/me/clients", allow_root_itself = false },
# ]
# default_root = "Projects"   # with roots: where "Clone from git" suggests a folder (default: the first)
# git_timeout_secs = 300

# The Agents screen: custom sub-agents for Claude Code (Markdown), Codex (TOML) and agy (Markdown), per project and
# user-wide. Saving an agent writes <name>.md / <name>.toml into the first folder of each list (or rewrites the file
# it was found in), and removes the files of CLIs dropped from its targets. MAP never writes outside these folders.
# `~` expands to $HOME; *_project_dirs are relative to each workspace.
[agents]
# claude_project_dirs = [".claude/agents"]
# codex_project_dirs = [".codex/agents"]
# gemini_project_dirs = [".agents/agents"]
# claude_user_dirs = ["~/.claude/agents"]
# codex_user_dirs = ["~/.codex/agents"]
# gemini_user_dirs = ["~/.gemini/config/agents"]
# CLIs MAP writes no agent files for, that load another CLI's agents themselves; the Agents screen shows them as extra
# columns. Cursor and Copilot read Claude Code's .claude/agents in a project.
# [agents.also_loaded_by.cursor]
# reads = "claude"
# scopes = ["project"]
# Plan limits per provider account, shown on the Usage screen and in the top bar. Claude: the account endpoint the
# CLI's /usage reads, with Claude Code's own sign-in (the token only ever goes to api.anthropic.com). Codex: the
# newest rate-limit snapshot in its session logs (from its last run). OpenRouter: the API key's own credit limit
# (GET openrouter.ai/api/v1/key with OPENROUTER_API_KEY, sent nowhere else). Other CLIs (agy, Cursor, Copilot) have no
# usage source MAP can read, so the Usage screen says so.
[usage]
# enabled = true
# interval_secs = 300
# The orchestrator gives a provider no new tasks once any of its windows is at or above this percentage.
skip_pct = 90
# claude_credentials = "~/.claude/.credentials.json"
# claude_projects = "~/.claude/projects"
# codex_sessions = "~/.codex/sessions"
# codex_auth = "~/.codex/auth.json"
# Turn a reader off, or pick one ("claude", "codex", "openrouter", "none") for a provider with another name.
# [usage.providers.codex]
# enabled = false

# Update checks for the agent CLIs: each provider's `version` command against its `latest` source (see the provider
# fields above). Each new release is announced once as an `update.available` event and a toast.
[updates]
# enabled = true
# Every 6 hours (at least 300).
# interval_secs = 21600
# Limit for each version command and each request for the latest version.
# timeout_secs = 15

# Lanes: tmux sessions someone else owns (an agent you started yourself, on tmux's default server or a named
# socket) that MAP watches. Each tick MAP reads the pane (busy / idle / dialog / unsent text / parked at the usage
# limit, context %, the CLI's /clear hint), the agent's status file, git and the card folders, and reports to
# Telegram. It types into a lane only when `actions` is on and the session is idle with nobody attached: `/clear`
# when the card is done and the CLI says it is time, then `status_prompt`; the resume prompt after a usage-limit
# reset. It never creates, kills, renames or resizes a lane session. The dashboard (Lanes) and Telegram's /watch
# change watch / actions / clear / status_prompt at runtime; POST /api/lanes/import-watcher fills the rest from an
# agent-watcher config.json.
[lane_watch]
# interval_secs = 60
# Two captures this far apart: a pane still moving is busy.
# confirm_secs = 3
# After /clear, wait this long before checking it took.
# clear_settle_secs = 4
# key_delay_ms = 600

# Every lane belongs to a project: `project` (a slug), else the project whose folder is `path`, else none. The
# standard is two per project, roles manager and developer, named <role>-<project short name>. A project can also
# add lanes on the dashboard (watch an existing session, or start a MAP session); those live in the database, not
# here, and a block here with the same name wins.
# [[lanes]]
# name = "developer-bistro"
# project = "bistro-orders"
# manager, developer or any other lowercase word.
# role = "developer"
# The lane's previous name: at startup its overrides, memory, queued tells and history move to `name` (once, when
# `name` has none yet). With session_match empty, the old name also keeps matching the session (map-tell sends it).
# rename_from = "bistro-agos"
# "" = tmux's default server (no -L).
# socket = ""
# Globs; default [name] (plus rename_from).
# session_match = ["bistro*"]
# path = "~/project/bistro"
# The agent writes {card, state: done|working|blocked, need_clear, note, at} here.
# status_file = ".scratch/agent-status.json"
# todo/, todo-human/, done/ are counted when todo/ exists; an empty todo/ stops the status prompt (not the notices).
# tasks_dir = "tasks"
# false: watch and notify only, never type.
# actions = true
# Typed as one line; or status_prompt_file = "~/prompts/bistro-status.txt".
# status_prompt = "Read .scratch/agent-status.json; finish the card if unfinished, else take the next from tasks/todo/."
# Context used when the pane does not print `N% context used` (current Claude Code): the newest transcript in
# <claude_dir>/projects/<path, non-alphanumerics as ->/*.jsonl, read only, over context_window tokens.
# claude_dir = "~/.claude"
# context_window = 200000
# [lanes.clear_when]
# enabled = true
# idle_mins = 30
# cooldown_mins = 30
# context_pct = 15
# Never mid-card: only after the status file says done (and is no older than status_max_age_mins).
# only_when_done = true
# status_max_age_mins = 180
# [lanes.ask_when]
# 0 = never prompt only because the pane sat idle.
# idle_stale_mins = 30
# cooldown_mins = 60
# After a card is done or the usage limit reset.
# resume_cooldown_mins = 10
# status_max_age_mins = 180
# max_sessions_per_round = 1
# [lanes.stall_when]
# A dialog, unsent text or a pane still parked after the reset, unchanged this long, alerts; again every repeat_mins.
# stall_mins = 20
# repeat_mins = 120
#
# [[lanes]]
# name = "manager-bistro"
# project = "bistro-orders"
# role = "manager"
# Its tmux session is still called manager-agos: with session_match empty, rename_from keeps it matched.
# rename_from = "manager-agos"
# actions = false

# Telegram: the hourly lane report, and at once: a card finished, a lane stuck, cleared, prompted or parked at the
# limit, a MAP task done, failed or held by intake, a plan waiting for approval. MAP never stores the token: it reads
# token_env from its environment, else the `TOKEN_ENV=value` line of env_file. Only one process per bot token may
# run the command listener (Telegram answers a second one with 409): stop any other consumer, or set commands = false.
[telegram]
enabled = false
# token_env = "TELOXIDE_TOKEN"
# env_file = "~/.config/map/telegram.env"
# chat_id = -1001234567890
# Users whose /watch and /status are obeyed; empty = anyone in chat_id. Others are ignored silently.
# allowed_user_ids = []
# api_base = "https://api.telegram.org"
# /watch (per-lane on/off buttons) and /status over getUpdates.
# commands = true
# The full report on this minute of every hour (and whenever 70 minutes passed without one).
# report_minute = 45
