# Runs MAP on this machine at 127.0.0.1:${MAP_PORT}. Put a tunnel or an authenticating proxy in front to reach it
# from elsewhere. Settings come from .env (copy .env.example); `map.toml` lives in ${MAP_CONFIG_DIR} (start from
# deploy/map.docker.toml). See README, "Deploy with Docker Compose".
services:
  map:
    build:
      context: .
      args:
        MAP_UID: ${MAP_UID:?set MAP_UID in .env}
        MAP_GID: ${MAP_GID:?set MAP_GID in .env}
        MAP_USER: ${MAP_USER:?set MAP_USER in .env}
        MAP_HOME: ${MAP_HOME:?set MAP_HOME in .env}
    image: multi-agent-platform:local
    container_name: map
    restart: unless-stopped
    command: ["serve", "-c", "${MAP_CONFIG_DIR}/map.toml"]
    ports:
      - "127.0.0.1:${MAP_PORT:-4400}:4400"
    environment:
      # The agent CLIs are the host's, mounted below.
      PATH: ${MAP_HOME}/.local/bin:${MAP_NODE_DIR}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # Only for [agents_home] mode = "shared": Claude Code keeps its settings file in ~/.claude/.claude.json instead
      # of ~/.claude.json (the host rewrites ~/.claude.json by renaming over it, which a single-file bind mount cannot
      # follow). In isolated mode MAP sets CLAUDE_CONFIG_DIR to its own folder for every agent, so this is unused.
      CLAUDE_CONFIG_DIR: ${MAP_HOME}/.claude
    volumes:
      # The config folder, at the same path as on the host: map.toml (read-only), templates/, agents/ and data/ (the
      # database, run files, corpus repos, the default workspace, and MAP's own git access in data/git: its SSH key,
      # known_hosts, identity and the gitconfig agents get as GIT_CONFIG_GLOBAL).
      - ${MAP_CONFIG_DIR:?set MAP_CONFIG_DIR in .env}:${MAP_CONFIG_DIR}
      - ${MAP_CONFIG_DIR}/map.toml:${MAP_CONFIG_DIR}/map.toml:ro
      # The project folder, at the same path: projects can only be its sub-folders, and the dashboard's folder
      # picker browses nothing else. Set [projects] path in map.toml to this same path. Mounting it at another path
      # works too: then set [projects] roots = [{ name = "Projects", path = "<container path>", host_path =
      # "<host path>" }] so the dashboard also shows where each folder is on the host. Each extra folder you want
      # projects in needs its own mount here and its own entry in `roots`; agents in the container can reach only
      # what is mounted.
      - ${MAP_PROJECTS_DIR:?set MAP_PROJECTS_DIR in .env}:${MAP_PROJECTS_DIR}
      # No ~/.ssh is needed: clone, pull and push use MAP's own key from data/ (Settings → Git & SSH). Optional, only
      # if it exists on the host (a missing file becomes an empty directory): your global git config, which MAP's
      # gitconfig includes after its own defaults (`- ${MAP_HOME}/.gitconfig:${MAP_HOME}/.gitconfig:ro`).
      # Only for Settings → Git & SSH → "This machine's SSH setup": mount your ~/.ssh (keys, config, known_hosts)
      # read-only, `- ${MAP_HOME}/.ssh:${MAP_HOME}/.ssh:ro`. Without it that method finds no keys in the container.
      # An ssh-agent on the host is not reachable from here unless you also mount its socket and set SSH_AUTH_SOCK.
      # Agent sign-ins and history. With [agents_home] mode = "isolated" (deploy/map.docker.toml) they live in
      # ${MAP_CONFIG_DIR}/agent-home, inside the config mount above, and these three mounts can be removed. Keep them
      # for mode = "shared": the host's own sign-ins, so a token refresh on one side does not log out the other.
      - ${MAP_HOME}/.claude:${MAP_HOME}/.claude
      - ${MAP_HOME}/.codex:${MAP_HOME}/.codex
      - ${MAP_HOME}/.gemini:${MAP_HOME}/.gemini
      # Agent binaries (read-only): claude, codex (a Node script) and agy.
      - ${MAP_HOME}/.local/bin:${MAP_HOME}/.local/bin:ro
      - ${MAP_HOME}/.local/share/claude:${MAP_HOME}/.local/share/claude:ro
      - ${MAP_NODE_DIR}:${MAP_NODE_DIR}:ro
